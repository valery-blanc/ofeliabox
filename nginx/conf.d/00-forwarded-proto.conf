# ══════════════════════════════════════════════════════════════════════
#  Conserver le protocole d'origine derrière Traefik
# ══════════════════════════════════════════════════════════════════════
#
#  canaima.bibliofelia.org est servi par Traefik (sur Fez), qui termine le
#  TLS puis transmet la requête EN CLAIR vers http://192.168.0.147:80.
#
#  Du point de vue de nginx sur la Box, $scheme vaut donc « http » — alors
#  que le navigateur, lui, est en https. Sans ce map, la directive
#  `proxy_set_header X-Forwarded-Proto $scheme` écrasait le « https »
#  envoyé par Traefik. Les applications se croyaient en HTTP et
#  fabriquaient des URL http:// à l'intérieur d'une page https : le
#  navigateur les bloque (contenu mixte). C'est ce qui faisait perdre
#  ses feuilles de style à Moodle.
#
#  On conserve donc l'en-tête d'origine quand il existe, et on retombe
#  sur $scheme pour un accès direct à la Box (réseau local, point d'accès
#  Wi-Fi), où aucun proxy amont n'est présent.
#
map $http_x_forwarded_proto $forwarded_proto {
    default  $scheme;
    "~*^https" https;
    "~*^http$" http;
}

# Un proxy amont (Traefik) est present si et seulement si la requete
# porte un X-Forwarded-Proto. Sert au portail : les services exposes
# sur un port dedie de la Box (Digistorm : 3000) ne sont joignables
# qu'en acces direct.
map $http_x_forwarded_proto $via_upstream_proxy {
    default  "true";
    ""       "false";
}
