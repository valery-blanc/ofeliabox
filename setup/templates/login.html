<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Ofelia Box</title>
<style>
  :root {
    --bg:      #0f172a;
    --card:    #1e293b;
    --border:  #334155;
    --text:    #e2e8f0;
    --muted:   #94a3b8;
    --accent:  #38bdf8;
    --danger:  #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem 1.75rem;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
  }
  .logo { font-size: 2.5rem; text-align: center; line-height: 1; }
  h1 {
    margin: .75rem 0 .25rem;
    font-size: 1.2rem;
    font-weight: 600;
    text-align: center;
  }
  .sub {
    margin: 0 0 1.5rem;
    font-size: .85rem;
    color: var(--muted);
    text-align: center;
  }
  label {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: .4rem;
  }
  input[type=password] {
    width: 100%;
    padding: .7rem .8rem;
    font-size: 1rem;
    color: var(--text);
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 1.1rem;
    padding: .75rem;
    font-size: .95rem;
    font-weight: 600;
    color: #06283d;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    margin-top: 1rem;
    padding: .6rem .75rem;
    font-size: .85rem;
    color: var(--danger);
    background: rgba(248, 113, 113, .1);
    border: 1px solid rgba(248, 113, 113, .3);
    border-radius: 8px;
    text-align: center;
  }
  .foot {
    margin-top: 1.5rem;
    font-size: .75rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <form class="card" method="post" autocomplete="off">
    <div class="logo">🔐</div>
    <h1>Administration de la Box</h1>
    <p class="sub">Ofelia — configuration et maintenance</p>

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password"
           autofocus required autocomplete="current-password">

    <button type="submit">Se connecter</button>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <p class="foot">
      Cet espace pilote les applications, le réseau et les sauvegardes.<br>
      Pour accéder à la bibliothèque, retourne au <a href="/">portail</a>.
    </p>
  </form>
</body>
</html>
