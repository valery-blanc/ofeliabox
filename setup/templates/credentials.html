<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identifiants — Ofelia</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding: 0 0 40px;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.35rem; }
  header a { margin-left: auto; color: var(--muted); text-decoration: none; font-size: .9rem; }
  header a:hover { color: var(--accent); }

  .sections { max-width: 760px; margin: 24px auto 0; padding: 0 20px; }

  .intro {
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 22px;
    font-size: .86rem; color: var(--muted); line-height: 1.5;
  }

  .app-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .app-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
  .app-url { font-size: .82rem; margin-bottom: 14px; }
  .app-url a { color: var(--accent); text-decoration: none; }

  .cred-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; flex-wrap: wrap;
  }
  .cred-label { min-width: 105px; font-size: .82rem; color: var(--muted); }
  .cred-value {
    flex: 1; min-width: 150px;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: .92rem; padding: 6px 10px;
    background: #0b1220; border: 1px solid var(--border); border-radius: 7px;
    cursor: pointer; word-break: break-all;
  }
  .cred-value.editing {
    border-color: var(--accent); background: #0f1b2e; cursor: text; outline: none;
  }

  button {
    font-family: inherit; font-size: .8rem; cursor: pointer;
    padding: 6px 11px; border-radius: 7px;
    border: 1px solid var(--border); background: #0b1220; color: var(--muted);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.copied, button.ok { border-color: var(--ok); color: var(--ok); }

  .row-msg { font-size: .8rem; margin: 2px 0 8px 115px; min-height: 1em; }
  .row-msg.ok { color: var(--ok); }
  .row-msg.err { color: var(--err); }
  .row-msg.wait { color: var(--warn); }

  .note { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  #chargement { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>

<header>
  <h1>Identifiants Ofelia</h1>
  <a href="/">← Retour au portail</a>
</header>

<div class="sections">
  <div class="intro">
    Le bouton <strong>Modifier</strong> change le mot de passe <strong>dans
    l'application elle-même</strong>, pas seulement dans cette page. Le nouveau
    mot de passe est utilisable immédiatement.
  </div>
  <div id="chargement">Chargement…</div>
  <div id="apps"></div>
</div>

<script>
// Les applications qui savent changer leur mot de passe (cf. /api/set-password).
// Les autres sont affichees en lecture seule : proposer un bouton qui ne peut
// pas tenir sa promesse serait pire que de ne rien proposer.
const MODIFIABLES = ['bibliofelia', 'moodle', 'kolibri', 'calibre'];

const META = {
  bibliofelia: { nom: 'BibliOfelia', url: '/bibliofelia/' },
  moodle:      { nom: 'Moodle',      url: '/moodle/' },
  kolibri:     { nom: 'Kolibri',     url: '/kolibri/' },
  calibre:     { nom: 'Calibre',     url: '/calibre/' },
  digistorm:   { nom: 'Digistorm',   url: null,
                 note: "Digistorm n'a pas de compte : l'accès est libre sur le réseau de la Box." },
  portainer:   { nom: 'Portainer',   url: '/portainer/',
                 note: "Le mot de passe se définit au premier accès, dans Portainer." },
  mariadb:     { nom: 'MariaDB',     url: null,
                 note: "Compte de service, utilisé par Moodle. À ne pas changer ici : les applications qui s'y connectent cesseraient de fonctionner." },
};

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function ligne(libelle, valeur, options) {
  const opts = options || {};
  const row = el('div', 'cred-row');
  row.appendChild(el('span', 'cred-label', libelle));

  const val = el('span', 'cred-value', valeur);
  val.onclick = function () { copier(val, null); };
  row.appendChild(val);

  const btnCopier = el('button', null, 'Copier');
  btnCopier.onclick = function () { copier(val, btnCopier); };
  row.appendChild(btnCopier);

  if (opts.modifiable) {
    const btnModifier = el('button', null, '✏ Modifier');
    row.appendChild(btnModifier);
    const msg = el('div', 'row-msg');

    btnModifier.onclick = function () {
      if (val.isContentEditable) return;
      const avant = val.textContent;
      val.contentEditable = 'true';
      val.classList.add('editing');
      val.onclick = null;
      val.focus();
      document.getSelection().selectAllChildren(val);
      btnModifier.textContent = '✓ Enregistrer';
      btnCopier.disabled = true;

      const annuler = el('button', null, 'Annuler');
      row.appendChild(annuler);

      function sortir() {
        val.contentEditable = 'false';
        val.classList.remove('editing');
        val.onclick = function () { copier(val, null); };
        btnModifier.textContent = '✏ Modifier';
        btnCopier.disabled = false;
        annuler.remove();
      }

      annuler.onclick = function () { val.textContent = avant; sortir(); };

      btnModifier.onclick = function () {
        const nouveau = val.textContent.trim();
        if (nouveau === avant) { sortir(); return; }
        if (nouveau.length < 6) {
          msg.textContent = 'Mot de passe trop court (6 caractères minimum).';
          msg.className = 'row-msg err';
          return;
        }
        btnModifier.disabled = true;
        annuler.disabled = true;
        msg.textContent = 'Changement en cours dans ' + opts.nom + '…';
        msg.className = 'row-msg wait';

        fetch('/api/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ app: opts.app, password: nouveau }),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            btnModifier.disabled = false;
            annuler.disabled = false;
            if (d.ok) {
              msg.textContent = '✓ ' + (d.message || 'Mot de passe changé');
              msg.className = 'row-msg ok';
              sortir();
              setTimeout(function () { msg.textContent = ''; msg.className = 'row-msg'; }, 6000);
            } else {
              // On garde la saisie a l'ecran : l'utilisateur peut corriger
              // sans avoir a tout retaper.
              msg.textContent = '✗ ' + (d.error || 'Échec du changement');
              msg.className = 'row-msg err';
            }
          })
          .catch(function () {
            btnModifier.disabled = false;
            annuler.disabled = false;
            msg.textContent = "✗ L'assistant n'a pas répondu.";
            msg.className = 'row-msg err';
          });
      };
    };

    return [row, msg];
  }

  return [row];
}

function copier(valEl, btn) {
  navigator.clipboard.writeText(valEl.textContent).then(function () {
    if (btn) {
      btn.textContent = '✓ Copié';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 1500);
    } else {
      valEl.style.borderColor = 'var(--ok)';
      setTimeout(function () { valEl.style.borderColor = ''; }, 1000);
    }
  });
}

fetch('/credentials-data.json', { cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    document.getElementById('chargement').remove();
    const hote = document.getElementById('apps');

    // La page est desormais engendree a partir des donnees. Ecrite en dur,
    // elle oubliait BibliOfelia et affichait encore Koha, PMB et SLiMS,
    // desinstalles depuis.
    const ordre = Object.keys(META).filter(function (k) { return k in data; })
      .concat(Object.keys(data).filter(function (k) { return !(k in META); }));

    ordre.forEach(function (cle) {
      const infos = data[cle];
      const meta = META[cle] || { nom: cle.charAt(0).toUpperCase() + cle.slice(1), url: null };
      const bloc = el('div', 'app-block');
      bloc.appendChild(el('div', 'app-title', meta.nom));

      const urlDiv = el('div', 'app-url');
      if (cle === 'digistorm') {
        // Digistorm vit sur le port 3000 : l'adresse depend de l'hote
        // par lequel on atteint la Box.
        const a = el('a', null, 'http://' + location.hostname + ':3000/');
        a.href = 'http://' + location.hostname + ':3000/';
        a.target = '_blank';
        urlDiv.appendChild(a);
      } else if (meta.url) {
        const a = el('a', null, meta.url);
        a.href = meta.url;
        urlDiv.appendChild(a);
      }
      bloc.appendChild(urlDiv);

      if (infos.user) {
        ligne('Utilisateur', infos.user, {}).forEach(function (n) { bloc.appendChild(n); });
      }
      if (infos.password) {
        ligne('Mot de passe', infos.password, {
          modifiable: MODIFIABLES.indexOf(cle) !== -1,
          app: cle, nom: meta.nom,
        }).forEach(function (n) { bloc.appendChild(n); });
      }
      if (meta.note) bloc.appendChild(el('div', 'note', meta.note));
      hote.appendChild(bloc);
    });
  })
  .catch(function () {
    document.getElementById('chargement').textContent =
      "Impossible de lire les identifiants. L'assistant vient peut-être de redémarrer — réessayez dans quelques secondes.";
  });
</script>
</body>
</html>
