<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Identifiants — Ofelia</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding: 0 0 40px;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.35rem; }
  header a { margin-left: auto; color: var(--muted); text-decoration: none; font-size: .9rem; }
  header a:hover { color: var(--accent); }

  .sections { max-width: 760px; margin: 24px auto 0; padding: 0 20px; }

  .intro {
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 22px;
    font-size: .86rem; color: var(--muted); line-height: 1.5;
  }

  .app-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .app-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
  .app-url { font-size: .82rem; margin-bottom: 14px; }
  .app-url a { color: var(--accent); text-decoration: none; }

  .cred-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; flex-wrap: wrap;
  }
  .cred-label { min-width: 105px; font-size: .82rem; color: var(--muted); }
  .cred-value {
    flex: 1; min-width: 150px;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: .92rem; padding: 6px 10px;
    background: #0b1220; border: 1px solid var(--border); border-radius: 7px;
    cursor: pointer; word-break: break-all;
  }
  .cred-value.editing {
    border-color: var(--accent); background: #0f1b2e; cursor: text; outline: none;
  }

  button {
    font-family: inherit; font-size: .8rem; cursor: pointer;
    padding: 6px 11px; border-radius: 7px;
    border: 1px solid var(--border); background: #0b1220; color: var(--muted);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.copied, button.ok { border-color: var(--ok); color: var(--ok); }

  .row-msg { font-size: .8rem; margin: 2px 0 8px 115px; min-height: 1em; }
  .row-msg.ok { color: var(--ok); }
  .row-msg.err { color: var(--err); }
  .row-msg.wait { color: var(--warn); }

  .note { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.45; }

  /* L'oeil doit rester discret : c'est un revelateur ponctuel, pas une
     action principale. Meme largeur que les autres boutons pour que les
     lignes restent alignees. */
  .langs { display: flex; gap: 4px; margin-left: auto; }
  .langs button {
    padding: 4px 8px; font-size: .72rem; font-weight: 600;
    letter-spacing: .03em; min-width: 0;
  }
  .langs button.on { border-color: var(--accent); color: var(--accent); }

  button.oeil {
    padding: 6px 9px; font-size: .95rem; line-height: 1;
    min-width: 36px; text-align: center;
  }
  .cred-value.masque {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    letter-spacing: .18em;
  }
  #chargement { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>

<header>
  <h1 data-i18n="title">Identifiants Ofelia</h1>
  <div class="langs" id="langs"></div>
  <a href="/credentials/logout" style="margin-left:16px" data-i18n="logout">Se déconnecter</a>
  <a href="/" style="margin-left:16px" data-i18n="portal">← Portail</a>
</header>

<div class="sections">
  <div class="intro" data-i18n="intro">Le bouton Modifier change le mot de passe dans l'application elle-même. Il est utilisable immédiatement.</div>
  <div class="app-block" id="acces-ofelia">
    <div class="app-title" data-i18n="ofeliaAccess">Accès Ofelia</div>
    <div class="app-url">&nbsp;</div>
    <div id="acces-lignes"></div>

  </div>

  <div id="chargement" data-i18n="loading">Chargement…</div>
  <div id="apps"></div>
</div>

    ofeliaAccess: "Accesso Ofelia", user: "Utente", password: "Password",
    copy: "Copia", copied: "✓ Copiato", modify: "✏ Modifica", save: "✓ Salva",
    cancel: "Annulla", show: "Mostra la password", hide: "Nascondi la password",
    loading: "Caricamento…",
    masked: "Nascosta — clicca sull'occhio per mostrarla", tooShort: "Password troppo corta (%d caratteri minimo).",

    noAnswer: "✗ L'assistente non ha risposto.", failed: "✗ Modifica fallita",
    immediate: "— effettiva subito.",
    unreadable: "Impossibile leggere le credenziali. Riprova tra qualche secondo.",
    assistant: "Assistente di amministrazione", credsPage: "Pagina credenziali",

    serviceAccount: "Account di servizio, usato da Moodle.",
  },
  de: {
    title: "Ofelia-Zugangsdaten", logout: "Abmelden", portal: "← Portal",
    intro: "Die Schaltfläche Ändern ändert das Passwort in der Anwendung selbst. Es ist sofort nutzbar.",
    ofeliaAccess: "Ofelia-Zugang", user: "Benutzer", password: "Passwort",
    copy: "Kopieren", copied: "✓ Kopiert", modify: "✏ Ändern", save: "✓ Speichern",
    cancel: "Abbrechen", show: "Passwort anzeigen", hide: "Passwort verbergen",
    loading: "Wird geladen…",
    masked: "Verborgen — auf das Auge klicken zum Anzeigen", tooShort: "Passwort zu kurz (mindestens %d Zeichen).",
    changing: "Wird in %s geändert…", saving: "Wird gespeichert…",
    noAnswer: "✗ Der Assistent hat nicht geantwortet.", failed: "✗ Änderung fehlgeschlagen",
    immediate: "— sofort wirksam.",
    unreadable: "Zugangsdaten nicht lesbar. Versuche es in einigen Sekunden erneut.",
    assistant: "Administrationsassistent", credsPage: "Zugangsdaten-Seite",
    noAccount: "kein Konto", firstAccess: "beim ersten Zugriff festlegen",
    serviceAccount: "Dienstkonto, von Moodle verwendet.",
  },
};

var lang = localStorage.getItem(LANG_KEY);
if (!T[lang]) lang = (navigator.language || 'fr').slice(0, 2);
if (!T[lang]) lang = 'fr';

// Le second argument sert de secours : un oubli affiche du francais plutot
// qu'un identifiant technique.
function t(cle, secours) {
  return (T[lang] && T[lang][cle]) || (T.fr && T.fr[cle]) || secours || cle;
}

function appliqueLangue() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(function (e) {
    var v = t(e.getAttribute('data-i18n'), null);
    if (v) e.textContent = v;
  });
  document.querySelectorAll('.langs button').forEach(function (b) {
    b.className = (b.dataset.lang === lang) ? 'on' : '';
  });
}

function barreLangues() {
  var hote = document.getElementById('langs');
  if (!hote) return;
  hote.innerHTML = '';
  LANGS.forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = l;
    b.textContent = l.toUpperCase();
    b.onclick = function () {
      lang = l;
      localStorage.setItem(LANG_KEY, l);
      appliqueLangue();
      // Le contenu de la page est engendre par le code : il ne porte pas de
      // data-i18n et doit etre redessine, pas seulement retraduit.
      if (window.redessiner) window.redessiner();
    };
    hote.appendChild(b);
  });
}

// Les applications qui savent changer leur mot de passe (cf. /api/set-password).
// Les autres sont affichees en lecture seule : proposer un bouton qui ne peut
// pas tenir sa promesse serait pire que de ne rien proposer.
const MODIFIABLES = ['bibliofelia', 'moodle', 'kolibri', 'calibre'];

// Les noms d'applications ne se traduisent pas ; seules les notes le font.
const META = {
  bibliofelia: { nom: 'BibliOfelia', url: '/bibliofelia/' },
  moodle:      { nom: 'Moodle',      url: '/moodle/' },
  kolibri:     { nom: 'Kolibri',     url: '/kolibri/' },
  calibre:     { nom: 'Calibre',     url: '/calibre/' },
  digistorm:   { nom: 'Digistorm',   url: null },
  portainer:   { nom: 'Portainer',   url: '/portainer/' },
  mariadb:     { nom: 'MariaDB',     url: null, note: 'serviceAccount' },
};

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function ligne(libelle, valeur, options) {
  const opts = options || {};
  const row = el('div', 'cred-row');
  row.appendChild(el('span', 'cred-label', libelle));

  const val = el('span', 'cred-value', valeur);
  // La valeur reelle vit dans le jeu de donnees, jamais dans le texte affiche
  // tant qu'elle est masquee : « Copier » y puise directement, donc on peut
  // copier un mot de passe sans jamais l'afficher.
  val.dataset.valeur = valeur;
  row.appendChild(val);

  const btnCopier = el('button', null, t('copy'));
  btnCopier.onclick = function () { copier(val, btnCopier); };

  // Seuls les mots de passe sont masques : masquer le nom d'utilisateur
  // n'apporterait rien et generait a chaque lecture.
  if (opts.secret) {
    const oeil = el('button', 'oeil', '\uD83D\uDC41');
    oeil.title = t('show');
    oeil.setAttribute('aria-label', t('show'));
    masquer(val);
    val.onclick = function () { basculerVisibilite(val, oeil); };
    oeil.onclick = function () { basculerVisibilite(val, oeil); };
    row.appendChild(oeil);
    row.appendChild(btnCopier);
  } else {
    val.onclick = function () { copier(val, null); };
    row.appendChild(btnCopier);
  }

  if (opts.modifiable) {
    const btnModifier = el('button', null, t('modify'));
    row.appendChild(btnModifier);
    const msg = el('div', 'row-msg');

    btnModifier.onclick = function () {
      if (val.isContentEditable) return;
      const avant = val.dataset.valeur !== undefined ? val.dataset.valeur : val.textContent;
      // On demasque le temps de la saisie : taper par-dessus des points
      // rendrait impossible de relire ce qu'on ecrit.
      if (val.classList.contains('masque')) {
        val.classList.remove('masque');
        val.textContent = avant;
      }
      val.contentEditable = 'true';
      val.classList.add('editing');
      val.onclick = null;
      val.focus();
      document.getSelection().selectAllChildren(val);
      btnModifier.textContent = t('save');
      btnCopier.disabled = true;

      const annuler = el('button', null, t('cancel'));
      row.appendChild(annuler);

      function sortir() {
        val.contentEditable = 'false';
        val.classList.remove('editing');
        val.dataset.valeur = val.textContent.trim();
        btnModifier.textContent = t('modify');
        btnCopier.disabled = false;
        annuler.remove();
        // On remasque en sortant : la valeur vient d'etre saisie, elle n'a
        // aucune raison de rester en clair.
        const oeil = row.querySelector('button.oeil');
        if (oeil) {
          masquer(val);
          oeil.textContent = '\uD83D\uDC41';
          val.onclick = function () { basculerVisibilite(val, oeil); };
        } else {
          val.onclick = function () { copier(val, null); };
        }
      }

      annuler.onclick = function () { val.textContent = avant; sortir(); };

      btnModifier.onclick = function () {
        const nouveau = val.textContent.trim();
        if (nouveau === avant) { sortir(); return; }
        const mini = opts.ofelia ? 8 : 6;
        if (nouveau.length < mini) {
          msg.textContent = t('tooShort').replace('%d', mini);
          msg.className = 'row-msg err';
          return;
        }
        btnModifier.disabled = true;
        annuler.disabled = true;
        msg.textContent = t('changing').replace('%s', opts.nom);
        msg.className = 'row-msg wait';

        // Deux points d'API distincts : les mots de passe d'Ofelia ne sont
        // pas des comptes applicatifs, ils protegent l'administration.
        fetch(opts.ofelia ? '/api/set-admin-password' : '/api/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(opts.ofelia
            ? { target: opts.app, password: nouveau }
            : { app: opts.app, password: nouveau }),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            btnModifier.disabled = false;
            annuler.disabled = false;
            if (d.ok) {
              msg.textContent = '✓ ' + (d.message || t('password')) + ' ' + t('immediate');
              msg.className = 'row-msg ok';
              sortir();
              setTimeout(function () { msg.textContent = ''; msg.className = 'row-msg'; }, 6000);
            } else {
              // On garde la saisie a l'ecran : l'utilisateur peut corriger
              // sans avoir a tout retaper.
              msg.textContent = (d.error ? '✗ ' + d.error : t('failed'));
              msg.className = 'row-msg err';
            }
          })
          .catch(function () {
            btnModifier.disabled = false;
            annuler.disabled = false;
            msg.textContent = t('noAnswer');
            msg.className = 'row-msg err';
          });
      };
    };

    return [row, msg];
  }

  return [row];
}

function masquer(valEl) {
  valEl.classList.add('masque');
  // Longueur fixe : un nombre de points egal a la longueur reelle
  // renseignerait un curieux sur la force du mot de passe.
  valEl.textContent = '\u2022'.repeat(10);
  valEl.title = t('masked');
}

function demasquer(valEl) {
  valEl.classList.remove('masque');
  valEl.textContent = valEl.dataset.valeur;
  valEl.title = '';
}

function basculerVisibilite(valEl, oeil) {
  if (valEl.classList.contains('masque')) {
    demasquer(valEl);
    oeil.textContent = '\uD83D\uDE48';
    oeil.title = t('hide');
    oeil.setAttribute('aria-label', t('hide'));
    // Re-masquage automatique : sur un poste partage, un mot de passe
    // revele et oublie a l'ecran est le defaut que ce masquage corrige.
    clearTimeout(valEl._minuterie);
    valEl._minuterie = setTimeout(function () {
      if (!valEl.isContentEditable) basculerVisibilite(valEl, oeil);
    }, 30000);
  } else {
    clearTimeout(valEl._minuterie);
    masquer(valEl);
    oeil.textContent = '\uD83D\uDC41';
    oeil.title = t('show');
    oeil.setAttribute('aria-label', t('show'));
  }
}

function copier(valEl, btn) {
  // On copie la valeur reelle, pas le texte affiche : sans cela, un mot de
  // passe masque se copierait en « •••••••••• ».
  const texte = valEl.dataset.valeur !== undefined
    ? valEl.dataset.valeur : valEl.textContent;
  navigator.clipboard.writeText(texte).then(function () {
    if (btn) {
      btn.textContent = t('copied');
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = t('copy'); btn.classList.remove('copied'); }, 1500);
    } else {
      valEl.style.borderColor = 'var(--ok)';
      setTimeout(function () { valEl.style.borderColor = ''; }, 1000);
    }
  });
}

// ── Les deux accès Ofelia ────────────────────────────────────────────
// Ils ne sont pas dans credentials-data.json : ce fichier decrit les
// applications, et l'on ne veut pas y ecrire en clair les mots de passe qui
// protegent l'administration elle-meme. Ils vivent dans un fichier separe,
// en 0600, jamais servi au navigateur — d'ou les points a la place de la
// valeur : cette page permet de les CHANGER, pas de les relire.
// ── Les deux acces Ofelia ────────────────────────────────────────────
// Val les veut avec le meme design que les autres lignes, oeil compris. Pour
// que l'oeil ait un sens, les deux mots de passe doivent donc etre servis au
// navigateur — ce qui n'etait pas le cas jusqu'ici. C'est defendable : la page
// est deja derriere son propre mot de passe et affiche deja tous les mots de
// passe applicatifs ; cacher ceux-la seuls serait incoherent.
function dessineAccesOfelia(secrets) {
  const hote = document.getElementById('acces-lignes');
  if (!hote) return;
  hote.innerHTML = '';
  [['admin', t('assistant')], ['credentials', t('credsPage')]].forEach(function (paire) {
    const cle = paire[0], libelle = paire[1];
    const bloc = el('div');
    bloc.appendChild(el('div', 'app-title', libelle));
    ligne(t('password'), (secrets && secrets[cle]) || '', {
      modifiable: true, secret: true, app: cle, nom: libelle, ofelia: true,
    }).forEach(function (n) { bloc.appendChild(n); });
    hote.appendChild(bloc);
  });
}

// ── Chargement ───────────────────────────────────────────────────────
// Les identifiants applicatifs et les deux acces Ofelia arrivent par le meme
// appel : une seule requete, et surtout un seul instant ou la page se dessine.
let _donnees = null;

function dessiner() {
  if (!_donnees) return;
  const data = _donnees;
  const hote = document.getElementById('apps');
  hote.innerHTML = '';

  dessineAccesOfelia(data._ofelia);

  // La page est engendree a partir des donnees : ecrite en dur, elle oubliait
  // BibliOfelia et affichait encore Koha, PMB et SLiMS, desinstalles depuis.
  const ordre = Object.keys(META).filter(function (k) { return k in data; })
    .concat(Object.keys(data).filter(function (k) {
      return !(k in META) && k.charAt(0) !== '_';
    }));

  ordre.forEach(function (cle) {
    const infos = data[cle];
    if (!infos || typeof infos !== 'object') return;
    const meta = META[cle] || { nom: cle.charAt(0).toUpperCase() + cle.slice(1), url: null };
    const bloc = el('div', 'app-block');
    bloc.appendChild(el('div', 'app-title', meta.nom));

    const urlDiv = el('div', 'app-url');
    if (cle === 'digistorm') {
      // Digistorm vit sur le port 3000 : l'adresse depend de l'hote par
      // lequel on atteint la Box.
      const a = el('a', null, 'http://' + location.hostname + ':3000/');
      a.href = 'http://' + location.hostname + ':3000/';
      a.target = '_blank';
      urlDiv.appendChild(a);
    } else if (meta.url) {
      const a = el('a', null, meta.url);
      a.href = meta.url;
      urlDiv.appendChild(a);
    }
    bloc.appendChild(urlDiv);

    if (infos.user) {
      ligne(t('user'), infos.user, {}).forEach(function (n) { bloc.appendChild(n); });
    }
    if (infos.password) {
      ligne(t('password'), infos.password, {
        modifiable: MODIFIABLES.indexOf(cle) !== -1,
        secret: true, app: cle, nom: meta.nom,
      }).forEach(function (n) { bloc.appendChild(n); });
    }
    if (meta.note) bloc.appendChild(el('div', 'note', t(meta.note)));
    hote.appendChild(bloc);
  });
}

// Appele par le selecteur de langue : le contenu est engendre par le code,
// il doit etre redessine et pas seulement retraduit.
window.redessiner = dessiner;

barreLangues();
appliqueLangue();

fetch('/credentials-data.json', { cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    const c = document.getElementById('chargement');
    if (c) c.remove();
    _donnees = data;
    dessiner();
  })
  .catch(function () {
    const c = document.getElementById('chargement');
    if (c) c.textContent = t('unreadable');
  });
</script>
