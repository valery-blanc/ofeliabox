services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_UPLOAD_LIMIT=${VITE_UPLOAD_LIMIT}
        - VITE_DEFAULT_LANGUAGE=${VITE_DEFAULT_LANGUAGE}
        - VITE_STORAGE=${VITE_STORAGE}
        - VITE_S3_PUBLIC_LINK=${VITE_S3_PUBLIC_LINK}
        - VITE_LEGAL_TERMS_LINK=${VITE_LEGAL_TERMS_LINK}
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=redis
      - DB_PORT=6379
      - REVERSE_PROXY=0
      - NODE_CLUSTER=0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./static/fichiers:/app/static/fichiers
      - ./static/temp:/app/static/temp
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.digistorm.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.digistorm.entrypoints=websecure
      - traefik.http.routers.digistorm.tls=true
      - traefik.http.routers.digistorm.tls.certresolver=letsencrypt
      - traefik.http.services.digistorm.loadbalancer.server.port=3000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${DB_PWD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DB_PWD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  traefik_letsencrypt:
  redis-data:
